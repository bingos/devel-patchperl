name: test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - run: perl -V
      - uses: actions/checkout@v4

      - name: Cache multiple paths
        uses: actions/cache@v4
        with:
          path: |
            ~/perl5
          key: perl5-${{ runner.os }}-${{ hashFiles('dist.ini') }}
          restore-keys: |
            perl5-${{ runner.os }}-

      - name: setup perl
        run: |
          echo "$HOME/perl5/bin" >> "$GITHUB_PATH"
          echo "PERL5LIB=$HOME/perl5/lib/perl5" >> "$GITHUB_ENV"
      - name: install dependencies
        run: |
          curl -L https://cpanmin.us | perl - -L ~/perl5 App::cpanminus
          cpanm -L ~/perl5 -n Dist::Zilla Test::Pod Test::Pod::Coverage Pod::Coverage::TrustPod
          dzil authordeps --missing | cpanm -L ~/perl5 -n
      - run: dzil test
      - run: dzil build

      - uses: actions/upload-artifact@v4
        with:
          name: Devel-PatchPerl.tar.gz
          path: Devel-PatchPerl-*.tar.gz

  test:
    runs-on: ${{ matrix.os }}
    needs:
      - build
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
        perl:
          - "5.42.1"
          - "5.42.0"
          - "5.40.3"
          - "5.40.2"
          - "5.40.1"
          - "5.40.0"
          - "5.38.5"
          - "5.38.4"
          - "5.38.3"
          - "5.38.2"
          - "5.38.1"
          - "5.38.0"
          - "5.36.3"
          - "5.36.2"
          - "5.36.1"
          - "5.36.0"
          - "5.34.3"
          - "5.34.2"
          - "5.34.1"
          - "5.34.0"
          - "5.32.1"
          - "5.32.0"
          - "5.30.3"
          - "5.30.2"
          - "5.30.1"
          - "5.30.0"
          - "5.28.3"
          - "5.28.2"
          - "5.28.1"
          - "5.28.0"
          - "5.26.3"
          - "5.26.2"
          - "5.26.1"
          - "5.26.0"
          - "5.24.4"
          - "5.24.3"
          - "5.24.2"
          - "5.24.1"
          - "5.24.0"
          - "5.22.4"
          - "5.22.3"
          - "5.22.2"
